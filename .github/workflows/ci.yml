name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/test_engine.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile app/Home.py
          python -m py_compile app/shared/auth.py
          python -m py_compile app/shared/state.py
          python -m py_compile app/shared/theme.py
          for f in app/pages/*.py; do python -m py_compile "$f"; done
          for f in dq_engine/*.py; do python -m py_compile "$f"; done

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dq-investigator .

      - name: Verify container starts
        run: |
          docker run -d --name dq-test -p 8501:8501 dq-investigator
          sleep 10
          curl -sf http://localhost:8501/_stcore/health || (docker logs dq-test && exit 1)
          docker stop dq-test
